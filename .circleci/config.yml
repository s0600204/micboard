version: 2.1

jobs:

  build:

    docker:
    - image: cimg/base:current

    resource_class:
      small

    steps:
    - setup_remote_docker:
        docker_layer_caching: false

    - checkout
    
    - run:
        name: Build Docker Image
        command: |
          docker image build -t micboard .

    - run:
        name: View build history
        command: |
          docker image history --no-trunc micboard

    - run:
        name: Upload Docker Image
        command: |
          docker image tag micboard s0600204/micboard:$CIRCLE_BRANCH
          echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin
          docker image push s0600204/micboard:$CIRCLE_BRANCH

workflows:
  version: 2
  build:
    jobs:
    - build:
        filters:
          branches:
            ignore: docker
